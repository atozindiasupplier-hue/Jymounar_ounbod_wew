<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uttam Horizon - Gym Lead Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Ghost White Background */
        body {
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Bar Header */
        .top-bar {
            background-color: #0f172a;
            color: #ffffff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .brand-title {
            font-size: 20px;
            font-weight: 700;
            color: #10b981; /* Emerald Green */
            letter-spacing: 0.5px;
        }

        .lang-btn {
            background-color: #10b981;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            background-color: #059669;
            color: #ffffff;
        }

        /* Main Container Responsive Layout */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            flex: 1;
        }

        .form-card {
            background-color: #1e293b;
            color: #ffffff;
            padding: 35px;
            border-radius: 14px;
            width: 100%;
            max-width: 520px; /* Perfect for Desktop & Mobile */
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            border-top: 5px solid #10b981;
        }

        .form-title {
            text-align: center;
            margin-bottom: 25px;
            color: #10b981;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #10b981;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #10b981;
            border: none;
            border-radius: 8px;
            color: #0f172a;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background-color: #059669;
            color: #ffffff;
        }

        .submit-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
            color: #94a3b8;
        }

        .success-msg {
            display: none;
            text-align: center;
            font-weight: 600;
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.5;
        }
